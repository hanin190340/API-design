
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Edit Department</title>
    <style>body{font-family:Inter,system-ui,Arial;padding:20px;background:#f6f9fc;color:#04263b}.card{max-width:720px;margin:0 auto;background:#fff;padding:18px;border-radius:10px}</style></head>
<body>
<div class="card">
    <h2>Edit Department</h2>
    <div id="msg"></div>
    <label>Name</label><input id="name"><label>Code</label><input id="code"><label>Description</label><textarea id="description"></textarea><label>Head</label><input id="head"><label>Active</label><select id="isActive"><option value="true">true</option><option value="false">false</option></select>
    <div style="margin-top:12px"><button id="save">Save</button> <a href="list-departments.html"><button type="button">Back</button></a></div>
</div>

<script>
    const apiBase = '/department';
    function qs(name){ const p = new URLSearchParams(location.search); return p.get(name);}
    const id = qs('id'); if(!id){ document.getElementById('msg').textContent='No id provided'; }
    async function load(){ try{ const r = await fetch(apiBase + '/getById?id='+id); if(!r.ok){ document.getElementById('msg').textContent='Error '+r.status; return;} const d = await r.json(); document.getElementById('name').value = d.name||''; document.getElementById('code').value = d.code||''; document.getElementById('description').value = d.description||''; document.getElementById('head').value = d.head||''; document.getElementById('isActive').value = d.isActive? 'true':'false'; }catch(e){ document.getElementById('msg').textContent='Network: '+e.message } }
    document.getElementById('save').addEventListener('click', async ()=>{
      const payload = { id: parseInt(id), name: document.getElementById('name').value, code: document.getElementById('code').value, description: document.getElementById('description').value, head: document.getElementById('head').value, isActive: document.getElementById('isActive').value === 'true' };
      try{ const resp = await fetch(apiBase + '/update',{ method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload)}); if(resp.ok){ alert('Saved'); location.href='list-departments.html'; } else { alert('Failed: '+resp.status) } }catch(e){ alert('Network: '+e.message) }
    });
    if(id) load();
</script>
</body>
</html>
